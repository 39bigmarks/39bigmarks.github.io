    <article id="articleContainer" class="articleContainer">
        <h2 align="middle">Hello there, I'm big mark.</h2>
        <br />
		<h3 align="middle">3D Generalist | Digital Painter | Game & Software Developer | Story Writer | Multi-instrumentalist | Musician</h3>
        <p align="middle">I'm currently <span id="age"></span> years old, <span id="checkIfBirthday"></span></p>
        <script>
            let age = getAge("2008/08/12") - 1;
            let checkIfBirthday = daysUntilBirthday(8, 12) + 1 == 364 || daysUntilBirthday(8, 12) + 1 == 365;

            document.getElementById("age").textContent = age;
            document.getElementById("checkIfBirthday").innerHTML = checkIfBirthday ? "and it's actually my birthday today today!" : "but I will be turning <span id=\"ageToCome\"></span> soon, in exactly <span id=\"daysRemaining\"></span> days.";

            if (!checkIfBirthday) {
                document.getElementById("ageToCome").textContent = getAge("2008/08/12");
                document.getElementById("daysRemaining").textContent = daysUntilBirthday(8, 12);
            }
        </script>
    </article>
